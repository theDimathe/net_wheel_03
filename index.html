<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucky Wheel Bonus Spin | £3,000 + 100 Free Spins</title>
    <meta
      name="description"
      content="Spin the Lucky Wheel for a chance to win a £3,000 bonus and 100 free spins in a fast, high-energy promo experience."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene">
      <div class="scene__bg" aria-hidden="true"></div>
      <div class="scene__shade" aria-hidden="true"></div>

      <header class="header">
        <div class="logo">
          <img src="source/lg.png" alt="N logo" />
        </div>
        <h1 class="title">
          <span class="title__accent">Bonus</span>
          <span class="title__value">£ 3,000</span>
          <span class="title__sub">+100 free spins</span>
        </h1>
      </header>

      <div class="character" aria-hidden="true">
        <img src="source/char.png" alt="" />
      </div>

      <div class="wheel-area">
        <div class="wheel">
          <div class="wheel__spin">
            <img class="wheel__bg" id="wheelBg" src="source/wh_bg.png" alt="Lucky wheel" />
          </div>
          <img class="wheel__border" src="source/wh_b.png" alt="" aria-hidden="true" />
          <button class="wheel__center" id="wheelCenter" type="button" aria-label="Start the wheel">
            <img src="source/wh_c.png" alt="" />
          </button>
        </div>
      </div>

      <button class="spin-button" id="spinButton" type="button">Spin</button>

      <div class="modal" id="modal" aria-hidden="true">
        <div class="modal__backdrop"></div>
        <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <div class="modal__body">
            <h2 id="modalTitle">Congratulations!</h2>
            <p>You won +100 free spins and a £3,000 bonus.</p>
            <button class="modal__button" type="button" id="modalButton">Claim bonus</button>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
